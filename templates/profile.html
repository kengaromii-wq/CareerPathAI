```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile - CareerPath AI</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        .back-btn {
            text-decoration: none;
            color: white;
            background: #2563eb;

            padding: 10px 18px;
            border-radius: 8px;
        }

        .back-btn:hover {
            background: #1d4ed8;
        }

        .container {
            width: 90%;
            max-width: 800px;

            margin: 40px auto;
        }

        .profile-card {
            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);
        }

        .profile-title {
            text-align: center;

            margin-bottom: 30px;
        }

        .profile-title h2 {
            font-size: 30px;

            margin-bottom: 8px;
        }

        .profile-title p {
            color: #666;
        }

        .avatar {
            width: 100px;
            height: 100px;

            margin: 0 auto 25px;

            border-radius: 50%;

            background: #2563eb;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 40px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 8px;
        }

        input,
        textarea,
        select {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {

            border-color: #2563eb;
        }

        textarea {

            resize: vertical;

            min-height: 110px;
        }

        .save-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        .save-btn:hover {

            background: #1d4ed8;
        }

        .info-box {

            margin-top: 25px;

            padding: 15px;

            background: #eff6ff;

            border-left: 5px solid #2563eb;

            border-radius: 8px;

            line-height: 1.5;
        }

        .success-message {

            background: #dcfce7;

            color: #166534;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            text-align: center;

            font-weight: bold;
        }

        @media (max-width: 600px) {

            header {

                padding: 15px 20px;
            }

            header h1 {

                font-size: 20px;
            }

            .container {

                width: 94%;

                margin: 25px auto;
            }

            .profile-card {

                padding: 25px 20px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>CareerPath AI</h1>

    <a href="/dashboard"
       class="back-btn">

        ← Dashboard

    </a>

</header>


<div class="container">


    <div class="profile-card">


        <div class="profile-title">


            <div class="avatar">

                👤

            </div>


            <h2>

                My Profile

            </h2>


            <p>

                Update your personal and career information

            </p>


        </div>


        {% if request.method == "POST" %}

        <div class="success-message">

            ✅ Profile saved successfully!

        </div>

        {% endif %}


        <form method="POST">


            <!-- FULL NAME -->

            <div class="form-group">

                <label>

                    Full Name

                </label>


                <input
                    type="text"
                    name="name"
                    value="{{ user[0] or '' }}"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>

                    Email

                </label>


                <input
                    type="email"
                    name="email"
                    value="{{ user[1] or '' }}"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- EDUCATION -->

            <div class="form-group">

                <label>

                    Education

                </label>


                <input
                    type="text"
                    name="education"
                    value="{{ user[2] or '' }}"
                    placeholder="Example: Diploma in Computer Engineering"
                >

            </div>


            <!-- COLLEGE -->

            <div class="form-group">

                <label>

                    College

                </label>


                <input
                    type="text"
                    name="college"
                    value="{{ user[3] or '' }}"
                    placeholder="Enter your college name"
                >

            </div>


            <!-- YEAR -->

            <div class="form-group">

                <label>

                    Year / Semester

                </label>


                <input
                    type="text"
                    name="year"
                    value="{{ user[4] or '' }}"
                    placeholder="Example: 3rd Year"
                >

            </div>


            <!-- CAREER -->

            <div class="form-group">

                <label>

                    Career Interest

                </label>


                <select name="career">


                    <option value="">

                        Select Career Interest

                    </option>


                    <option
                        value="Software Developer"
                        {% if user[5] == "Software Developer" %}
                        selected
                        {% endif %}
                    >

                        Software Developer

                    </option>


                    <option
                        value="UI/UX Designer"
                        {% if user[5] == "UI/UX Designer" %}
                        selected
                        {% endif %}
                    >

                        UI/UX Designer

                    </option>


                    <option
                        value="Data Analyst"
                        {% if user[5] == "Data Analyst" %}
                        selected
                        {% endif %}
                    >

                        Data Analyst

                    </option>


                    <option
                        value="Business Analyst"
                        {% if user[5] == "Business Analyst" %}
                        selected
                        {% endif %}
                    >

                        Business Analyst

                    </option>


                </select>

            </div>


            <!-- ABOUT -->

            <div class="form-group">

                <label>

                    About Me

                </label>


                <textarea
                    name="about"
                    placeholder="Write something about yourself..."
                >{{ user[6] or '' }}</textarea>

            </div>


            <!-- SAVE -->

            <button
                type="submit"
                class="save-btn"
            >

                💾 Save Profile

            </button>


        </form>


        <div class="info-box">

            <strong>💡 Tip:</strong>

            Keep your profile information updated to get better
            career recommendations.

        </div>


    </div>


</div>


</body>

</html>
```
