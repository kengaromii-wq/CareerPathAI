<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CareerPath AI - Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {

            width: 400px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.10);
        }

        .icon {

            text-align: center;

            font-size: 50px;

            margin-bottom: 10px;
        }

        h1 {

            text-align: center;

            margin-bottom: 8px;
        }

        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 30px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input {

            width: 100%;

            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;
        }

        input:focus {

            outline: none;

            border-color: #4f46e5;
        }

        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #4f46e5;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {

            background: #3730a3;
        }

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #4f46e5;

            text-decoration: none;
        }

        .error {

            background: #fee2e2;

            color: #b91c1c;

            padding: 10px;

            border-radius: 8px;

            margin-bottom: 18px;

            text-align: center;
        }

        @media (max-width: 500px) {

            .login-box {

                width: calc(100% - 30px);

                padding: 25px;
            }

        }

    </style>

</head>


<body>


<div class="login-box">


    <div class="icon">
        🔐
    </div>


    <h1>
        Admin Login
    </h1>


    <p class="subtitle">
        CareerPath AI Administration
    </p>


    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}


    <form method="POST"
          action="/admin-login">


        <label>
            Admin Email
        </label>

        <input
            type="email"
            name="email"
            placeholder="Enter admin email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter admin password"
            required
        >


        <button type="submit">
            Login as Admin 🔐
        </button>


    </form>


    <a href="/" class="back">
        ← Back to Home
    </a>


</div>


</body>

</html>
