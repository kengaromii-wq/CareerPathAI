<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerPath AI - Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: white;
            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.10);

            text-align: center;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            color: #4f46e5;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin: 8px 0 30px;
            font-size: 14px;
        }

        .admin-title {
            font-size: 20px;
            margin-bottom: 25px;
            color: #222;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
            color: #444;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .login-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #4f46e5;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .login-btn:hover {
            background: #3730a3;
        }

        .back-home {
            display: inline-block;

            margin-top: 22px;

            color: #4f46e5;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;
        }

        .back-home:hover {
            text-decoration: underline;
        }

        .security {
            margin-top: 25px;

            padding: 12px;

            background: #f8fafc;

            border-radius: 9px;

            font-size: 12px;

            color: #666;
        }

        @media (max-width: 480px) {

            .login-card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


<div class="login-container">

    <div class="login-card">


        <div class="logo">
            🔐
        </div>


        <h1>
            CareerPath AI
        </h1>


        <p class="subtitle">
            Smart Student Career Navigator
        </p>


        <h2 class="admin-title">
            Admin Login
        </h2>


        <form method="POST">


            <div class="form-group">

                <label for="email">
                    Admin Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter admin email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter admin password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login to Admin Panel
            </button>


        </form>


        <a
            href="/"
            class="back-home"
        >
            ← Back to Home
        </a>


        <div class="security">

            🔒 Authorized administrators only

        </div>


    </div>

</div>


</body>

</html>
